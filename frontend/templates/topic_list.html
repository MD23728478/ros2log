<section class="topic-list" aria-labelledby="topic-list-title">
  <header class="topic-list-header">
    <h2 id="topic-list-title" class="topic-list-title">Topics</h2>
    <button id="topic-list-refresh" class="btn btn-sm btn-outline-secondary" type="button">Refresh</button>
  </header>
  <label class="topic-list-search" for="topic-list-search">
    <span class="visually-hidden">Search topics</span>
    <input id="topic-list-search" class="form-control form-control-sm" type="search" placeholder="Search topics" autocomplete="off" />
  </label>
  <div id="topic-list" class="topic-list-items" aria-live="polite">Loading topics…</div>
</section>
