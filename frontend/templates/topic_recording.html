<section class="topic-recording" aria-labelledby="topic-recording-title">
  <header class="topic-recording-header">
    <h2 id="topic-recording-title" class="topic-recording-title">Recording</h2>
  </header>

  <div class="recording-status-block">
    <span id="recording-state" class="recording-state" data-state="idle">STATUS: IDLE</span>
    <div class="recording-controls">
      <button id="recording-start" class="btn-record-toggle" type="button" disabled>Start recording</button>
      <button id="recording-stop" class="btn-record-toggle stop" type="button" disabled>Stop</button>
    </div>
  </div>

  <div class="topic-recording-row recording-prefix">
    <label for="recording-prefix"><strong>Prefix (optional):</strong></label>
    <input id="recording-prefix" class="form-control form-control-sm" type="text" maxlength="32" placeholder="e.g. sprint3" autocomplete="off" />
  </div>

  <div class="topic-recording-row recording-timer">
    <strong>Duration (max 24h):</strong>

    <div class="recording-duration-fields">
      <label class="recording-duration-field">
        <input
          id="recording-hours"
          class="form-control form-control-sm"
          type="number"
          min="0"
          max="24"
          step="1"
          placeholder="0"
          aria-label="Hours"
        />
        <span>h</span>
      </label>

      <label class="recording-duration-field">
        <input
          id="recording-minutes"
          class="form-control form-control-sm"
          type="number"
          min="0"
          max="59"
          step="1"
          placeholder="0"
          aria-label="Minutes"
        />
        <span>min</span>
      </label>

      <label class="recording-duration-field">
        <input
          id="recording-seconds"
          class="form-control form-control-sm"
          type="number"
          min="0"
          max="59"
          step="1"
          placeholder="0"
          aria-label="Seconds"
        />
        <span>sec</span>
      </label>
    </div>
  </div>
  
  <div class="topic-recording-row">
    <strong>Selected topics:</strong>
    <span id="recording-topic">Select one or more topics from the list.</span>
  </div>
  <div class="topic-recording-row">
    <strong>Output:</strong>
    <span id="recording-output">—</span>
  </div>
  <div id="recording-error" class="topic-recording-error" role="alert"></div>
</section>
