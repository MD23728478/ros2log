<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}ROS 2 Log{% endblock %}</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
    >
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    >
  </head>

  <body class="app-shell" data-performance-poll-interval="{{ config.PERFORMANCE_POLL_INTERVAL_SECONDS }}">
    {% block content %}{% endblock %}

    <script
      src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"
    ></script>
    <script
      src="{{ url_for('static', filename='js/performance-poller.js') }}"
    ></script>
  </body>
</html>
